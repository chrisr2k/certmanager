[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certmanager"
version = "0.1.0"
description = "Enterprise Certificate Management SaaS — multi-datacenter, multi-cloud (AWS ACM, Azure Key Vault, AD CS)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Enterprise Security Team" }
]
keywords = ["certificates", "tls", "pki", "aws-acm", "azure-key-vault", "ad-cs", "certificate-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0,<5.0.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "azure-identity>=1.17.0",
    "azure-keyvault-certificates>=4.8.0",
    "aiohttp>=3.9.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "python-dateutil>=2.9.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
certmanager = "certmanager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["certmanager"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=certmanager --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
