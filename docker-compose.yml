services:
  # --- PostgreSQL with TimescaleDB ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: certmanager-postgres
    environment:
      POSTGRES_USER: certmanager
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: certmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host — 5432 is commonly taken by a local Postgres
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: certmanager-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      # 6380 on the host — 6379 is commonly taken by a local Redis
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI API server ---
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: certmanager-api
    environment:
      CERTMGMT_ENVIRONMENT: development
      CERTMGMT_DATABASE__URL: postgresql+asyncpg://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_DATABASE__URL_SYNC: postgresql+psycopg2://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_REDIS__URL: redis://redis:6379/0
      CERTMGMT_SECURITY__SECRET_KEY: dev-secret-key-change-in-production-1234567890
      CERTMGMT_SECURITY__ENCRYPTION_KEY: ""
      CERTMGMT_CORS__ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
      CERTMGMT_AGENT__PSK: dev-agent-psk-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./certmanager:/app/certmanager
      - ./alembic:/app/alembic
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    command: >
      sh -c "python -m alembic -c alembic/alembic.ini upgrade head &&
             python -c 'from certmanager.core.seed import seed_all; import asyncio; from certmanager.core.database import get_session_factory; asyncio.run(seed_all(get_session_factory()()))' &&
             uvicorn certmanager.api.app:app --host 0.0.0.0 --port 8000 --reload"

  # --- Celery worker (scans, alerts, reports, CT monitoring) ---
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: certmanager-worker
    environment:
      CERTMGMT_ENVIRONMENT: development
      CERTMGMT_DATABASE__URL: postgresql+asyncpg://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_DATABASE__URL_SYNC: postgresql+psycopg2://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_REDIS__URL: redis://redis:6379/0
      CERTMGMT_SECURITY__SECRET_KEY: dev-secret-key-change-in-production-1234567890
      CERTMGMT_SECURITY__ENCRYPTION_KEY: ""
      CERTMGMT_AGENT__PSK: dev-agent-psk-change-in-production
      CERTMGMT_SMTP__HOST: mailhog
      CERTMGMT_SMTP__PORT: "1025"
      CERTMGMT_SMTP__USE_TLS: "false"
      CERTMGMT_SMTP__FROM_ADDRESS: "CertManager <noreply@example.com>"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./certmanager:/app/certmanager
      - ./alembic:/app/alembic
      - ./reports:/app/reports
    command: celery -A certmanager.workers.celery_app worker --loglevel=info --concurrency=2

  # --- Celery beat (scheduled tasks) ---
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: certmanager-beat
    environment:
      CERTMGMT_ENVIRONMENT: development
      CERTMGMT_DATABASE__URL: postgresql+asyncpg://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_DATABASE__URL_SYNC: postgresql+psycopg2://certmanager:changeme@postgres:5432/certmanager
      CERTMGMT_REDIS__URL: redis://redis:6379/0
      CERTMGMT_SECURITY__SECRET_KEY: dev-secret-key-change-in-production-1234567890
      CERTMGMT_SECURITY__ENCRYPTION_KEY: ""
      CERTMGMT_AGENT__PSK: dev-agent-psk-change-in-production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./certmanager:/app/certmanager
      - ./alembic:/app/alembic
    command: celery -A certmanager.workers.celery_app beat --loglevel=info

  # --- Frontend (dev mode with Vite HMR) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: dev
    container_name: certmanager-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  # --- MailHog (email testing in development) ---
  mailhog:
    image: mailhog/mailhog
    container_name: certmanager-mailhog
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

volumes:
  pgdata:
  redisdata:
