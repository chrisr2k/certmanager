# Sensitive configuration — EDIT THE PLACEHOLDERS before applying.
#
# This is a plain Secret manifest: fill in the values below (or replace with
# an ExternalSecret backed by your secret manager of choice — the key names
# must stay identical). The values are plaintext in stringData only until
# first applied; afterwards edit via `kubectl edit secret`.
apiVersion: v1
kind: Secret
metadata:
  name: certmanager-secrets
  namespace: certmanager
  labels:
    app.kubernetes.io/name: certmanager
type: Opaque
stringData:
  CERTMGMT_DATABASE__URL: "postgresql+asyncpg://certmanager:CHANGE-ME@postgres.example.com:5432/certmanager"
  CERTMGMT_DATABASE__URL_SYNC: "postgresql+psycopg2://certmanager:CHANGE-ME@postgres.example.com:5432/certmanager"
  CERTMGMT_REDIS__URL: "redis://redis.example.com:6379/0"
  CERTMGMT_SECURITY__SECRET_KEY: "CHANGE-ME-64-character-random-string-for-jwt-signing"
  CERTMGMT_SECURITY__ENCRYPTION_KEY: "CHANGE-ME-base64-encoded-32-byte-aes-key"
  CERTMGMT_AGENT__PSK: "CHANGE-ME-agent-pre-shared-key"
  CERTMGMT_SMTP__USER: "CHANGE-ME-smtp-user"
  CERTMGMT_SMTP__PASSWORD: "CHANGE-ME-smtp-password"
