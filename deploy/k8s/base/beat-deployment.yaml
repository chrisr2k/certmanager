apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: certmanager
  labels:
    app.kubernetes.io/name: certmanager
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: certmanager
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certmanager
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: certmanager-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - certmanager.workers.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: certmanager-config
            - secretRef:
                name: certmanager-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
