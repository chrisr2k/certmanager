apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: certmanager
  labels:
    app.kubernetes.io/name: certmanager
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: certmanager
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certmanager
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: certmanager-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: certmanager-config
            - secretRef:
                name: certmanager-secrets
          livenessProbe:
            # The python:3.12-slim image has no curl; use urllib instead.
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
