apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: certmanager
  labels:
    app.kubernetes.io/name: certmanager
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: certmanager
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certmanager
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: certmanager-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - certmanager.workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: certmanager-config
            - secretRef:
                name: certmanager-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
