# The frontend image is built from docker/Dockerfile.frontend with an nginx
# stage serving the built static assets on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: certmanager
  labels:
    app.kubernetes.io/name: certmanager
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: certmanager
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certmanager
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: certmanager-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
